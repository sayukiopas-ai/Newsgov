<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Creative Board icon">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1b3a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded tile background -->
  <rect x="24" y="24" width="208" height="208" rx="52" fill="url(#g)" filter="url(#s)"/>

  <!-- Kanban columns -->
  <g fill="#ffffff">
    <rect x="68" y="72" width="28" height="112" rx="10" opacity="0.95"/>
    <rect x="114" y="72" width="28" height="112" rx="10" opacity="0.92"/>
    <rect x="160" y="72" width="28" height="112" rx="10" opacity="0.9"/>
  </g>

  <!-- Cards -->
  <g fill="#ffffff">
    <rect x="60" y="96" width="44" height="18" rx="9" opacity="0.95"/>
    <rect x="60" y="124" width="44" height="18" rx="9" opacity="0.9"/>

    <rect x="106" y="104" width="44" height="18" rx="9" opacity="0.95"/>
    <rect x="106" y="132" width="44" height="18" rx="9" opacity="0.9"/>

    <rect x="152" y="92" width="44" height="18" rx="9" opacity="0.95"/>
    <rect x="152" y="120" width="44" height="18" rx="9" opacity="0.9"/>
  </g>
</svg>
